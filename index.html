.stats{margin:22px 0 8px}
.nums{display:flex;align-items:stretch}

.col.mid{display:flex;flex-direction:column;justify-content:center}

.lbl{font-weight:500;font-size:min(3.4vw,1.05rem);color:#333;white-space:nowrap}
.prog{height:14px;background:#e3e8ef;border-radius:999px;margin:18px 0 14px;overflow:hidden}

.pm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:min(3.8vw,1.1rem);font-weight:500;white-space:nowrap}
.pm b{font-weight:800}
.pm svg{width:1.1em;height:1.1em;fill:var(--green);vertical-align:-.15em;margin-right:6px}
